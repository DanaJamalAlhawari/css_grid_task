<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task5</title>
<style>
    .container {
    display: grid;
    grid-template-columns: 2fr 2fr 2fr 1fr;
    grid-template-rows: 120px 120px 120px;
    gap: 10px;
    
    
    }

     .box {
            border-radius: 10px;
        }

.box1 {
    grid-column: 1 / 2;
    grid-row: 1 / 3;
     background-color: blue;
}
.box2 {
    grid-column: 2 / 5;
    grid-row: 1 / 2;
     background-color: #1d1b4f;
}
.box3 {
    grid-column: 1 / 2;
    grid-row: 3 / 4;

   background-color: #a7a8f4;
}
.box4 {
    grid-column: 2 / 4;
    grid-row: 2 / 4;

    background-color: lightgreen;

}
.box5 {
    grid-column: 4 / 5;
    grid-row: 2 / 3;
     background-color: #a8f5b5;
}



.box6 {
    grid-column: 4 / 5;
    grid-row: 3 / 4;
     background-color: #f3426c;
}






</style>


</head>
<body>
    <div class="container">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    <div class="box box5"></div>
    <div class="box box6"></div>
</div>
</body>
</html>
