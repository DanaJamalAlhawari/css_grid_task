<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task9</title>
    <style>

.container{
display:grid;
grid-template-columns:repeat(6,60px);
grid-template-rows:repeat(6,60px);
padding-top:40px;

}


.box{

height: 300px;
width:300px;
}

#box1{
 grid-column:1 /4;
 grid-row:1/4 ;
 background-color:#b44c4b
}
#box2{
    grid-column:2/5;
    grid-row:2/5;
    background-color: #4b4db4b3
}
#box3{
grid-column:3/6;
grid-row:3/6;
background-color: #4cb54ca1
}





    </style>
</head>
<body>
    
<div class="container">
    <div id="box1" class="box">
        Top
    </div>
    <div id="box2" class="box">
        Second
    </div>
    <div id="box3" class="box">
        Third
    </div>
</div>










</body>
</html>
